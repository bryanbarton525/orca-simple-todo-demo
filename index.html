<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vanilla Todo App</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>Todo List</h1>
<div id="app">
  <form id="todo-form">
    <input type="text" id="new-todo" placeholder="Add a new todo" required autocomplete="off">
    <button type="submit">Add</button>
  </form>
  <ul id="todo-list"></ul>
</div>
<script src="app.js"></script>
</body>
</html>
